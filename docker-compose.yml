# Local full-stack environment: PostgreSQL + API + static frontend (nginx).
#   cp backend/.env.example backend/.env   # then set GEMINI_API_KEY etc.
#   docker compose up --build
# App: http://localhost:8080
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fitpulse
      POSTGRES_PASSWORD: fitpulse
      POSTGRES_DB: fitpulse
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitpulse"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://fitpulse:fitpulse@db:5432/fitpulse?schema=public
      NODE_ENV: development # set to production behind HTTPS
      CORS_ORIGINS: http://localhost:8080
      APP_URL: http://localhost:8080
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "4000:4000"

  web:
    build: ./frontend
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  pgdata:
